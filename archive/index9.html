<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dheeraj Kumar | Full-Stack Core Engine</title>
    <!-- Tailwind CSS for lightweight positioning -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style9.css">
</head>
<body class="bg-[#02040a] text-slate-200 overflow-hidden font-mono antialiased select-none">

    <!-- WebGL Canvas for Fullscreen 3D Graphics -->
    <canvas id="3d-scene" class="fixed inset-0 w-full h-full z-10 focus:outline-none"></canvas>

    <!-- Holographic Ambient Telemetry Overlay -->
    <div class="pointer-events-none fixed inset-0 p-6 flex flex-col justify-between z-30 class-hud-lines">
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-cyan-400 font-bold tracking-widest text-xs uppercase animate-pulse">SYSTEM_ENGINE // DHEERAJ_KUMAR</h1>
                <p class="text-[9px] text-slate-500">5+ YR EXP // CORE: LARAVEL · NODE · VUE · NEXT</p>
            </div>
            <div class="text-right text-[9px] text-slate-400">
                <span id="utc-clock">TIMESTAMP: SYSTEM READY</span>
            </div>
        </div>
        
        <!-- Interactive Overlay: Displays only when a 3D Node is clicked -->
        <div class="w-full max-w-xl mx-auto mb-12 pointer-events-auto">
            <div id="sector-display" class="glass-overlay p-5 rounded-lg border border-cyan-500/20 translate-y-10 opacity-0 transition-all duration-500 hidden">
                <!-- Javascript will inject production details here dynamically -->
            </div>
        </div>
    </div>

    <!-- Import official Three.js framework as an ES module -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        window.THREE = THREE;
    </script>
    <script src="js/app9.js"></script>
</body>
</html>
