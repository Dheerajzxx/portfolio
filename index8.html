<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dheeraj Kumar — Terminal Portfolio</title>
    <meta name="description" content="Interactive terminal portfolio for Dheeraj Kumar, full stack developer with 5+ years of experience.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style8.css">
</head>
<body>
    <main class="desk">
        <section class="terminal" id="terminal" aria-label="Interactive portfolio terminal">
            <div class="titlebar">
                <div class="lights" aria-hidden="true">
                    <span class="light red"></span>
                    <span class="light yellow"></span>
                    <span class="light green"></span>
                </div>
                <span class="title">dheeraj@portfolio — zsh</span>
                <span class="title-meta">80×24</span>
            </div>

            <div class="screen" id="screen">
                <div class="output" id="output" aria-live="polite"></div>
                <form class="prompt-row" id="prompt-form" autocomplete="off">
                    <label class="prompt-label" for="command-input">dheeraj@portfolio:~$</label>
                    <input
                        class="prompt-input"
                        id="command-input"
                        name="command"
                        type="text"
                        spellcheck="false"
                        autocomplete="off"
                        autocapitalize="off"
                        aria-label="Type a command"
                    >
                </form>
            </div>

            <div class="hints" id="hints" aria-label="Command shortcuts">
                <span class="hints-label">try</span>
                <button type="button" data-cmd="help">help</button>
                <button type="button" data-cmd="about">about</button>
                <button type="button" data-cmd="work">work</button>
                <button type="button" data-cmd="stack">stack</button>
                <button type="button" data-cmd="contact">contact</button>
                <button type="button" data-cmd="clear">clear</button>
            </div>
        </section>

        <p class="outside">Not a terminal person? <a href="index2.html">View the editorial portfolio ↗</a></p>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app8.js"></script>
</body>
</html>
